name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build
        env:
          # Suppress CRA CI warnings-as-errors so the build succeeds
          CI: false

      - name: Verify server starts
        run: |
          node server/index.js &
          SERVER_PID=$!
          sleep 3
          curl -sf http://localhost:4000/api/health || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID
